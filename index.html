<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moda Urbana | Tienda Exclusiva</title>
    <!-- Fuente profesional premium -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">

</head>
<body>
    <header>
        <div class="header-container">
            <h1 class="logo">MODA<span>URBANA</span></h1>
            <div class="cart-icon" id="cart-icon">
                <svg xmlns="http://w3.org" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d=",1 2.5 4.5h16.5L17 14H7.4L4.3 2.5H1z"></path></svg>
                <span id="cart-count">0</span>
            </div>
        </div>
    </header>

    <main>
        <!-- Sección de Filtros -->
        <section class="filters-section">
            <div class="filters">
                <button class="filter-btn active" data-category="todos">Ver Todo</button>
                <button class="filter-btn" data-category="remeras">Remeras</button>
                <button class="filter-btn" data-category="pantalones">Pantalones</button>
                <button class="filter-btn" data-category="camperas">Camperas</button>
            </div>
        </section>

        <!-- Catálogo Principal -->
        <section class="catalog-section">
            <div class="products-container" id="products-container">
                <!-- Los productos se cargarán dinámicamente -->
            </div>
        </section>
    </main>

    <!-- Ventana del Carrito Deslizable (Sidebar) -->
    <div class="cart-overlay" id="cart-modal">
        <div class="cart-sidebar">
            <div class="cart-header">
                <h2>Tu Pedido</h2>
                <span class="close-modal" id="close-modal">&times;</span>
            </div>
            <div class="cart-body" id="cart-items">
                <!-- Items cargados dinámicamente -->
            </div>
            <div class="cart-footer">
                <div class="total-row">
                    <span>Total estimado:</span>
                    <span class="total-price">$<span id="cart-total-price">0</span></span>
                </div>
                <button class="checkout-btn" id="checkout-btn">Confirmar Compra</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
